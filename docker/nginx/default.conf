
# Define the server block and listen for incoming HTTP requests on port 80.
server {
    listen 80;

    # Define the server name used to match incoming requests.
    server_name localhost;

    # Set the document root to Laravel's public directory.
    # This ensures that only publicly accessible application files are served.
    root /var/www/html/public;

    # Define the default files Nginx should look for when handling a request.
    index index.php index.html;

    # Handle incoming requests.
    location / {
        # First, check whether the requested URI matches an existing file.
        # Then check whether it matches an existing directory.
        # If neither exists, forward the request to Laravel's front controller.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle requests for PHP files.
    location ~ \.php$ {

        # Forward PHP requests to the PHP-FPM service.
        # "app" is the PHP service name defined in docker-compose.yaml.
        # Port 9000 is the default PHP-FPM listening port.
        fastcgi_pass app:9000;

        # Define the default PHP script index.
        fastcgi_index index.php;

        # Include the standard FastCGI parameters required by PHP-FPM.
        include fastcgi_params;

        # Pass the absolute path of the requested PHP script to PHP-FPM.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to hidden files and directories starting with .ht.
    # This helps prevent exposure of sensitive configuration files.
    location ~ /\.ht {
        deny all;
    }
}
